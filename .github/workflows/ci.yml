name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - run: |
          python -m src.cli data/synthetic_flows.json --output /tmp/east-west.md
          grep -q "East-West Traffic Analysis" /tmp/east-west.md
